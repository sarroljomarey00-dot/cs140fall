<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname"><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname"><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="emailadd"><br>
            

            <legend>Gender</legend>
            <input type="radio" id="male" name="genderm">
            <label for="male">Male</label>
            <input type="radio" id="female" name="genderf">
            <label for="female">Female</label><br>

            <label for="fav">Favorite Class</label><br>
            <select id="fav" name="favclass">
                <option disabled hidden selected>Choose one</option> 
                <option value="Cs101">CS101</option> 
                <option value="Cs140">Cs140</option> 
                <option value="EIL320">EIL320</option> 
            </select><br>
            <br>
            <input type="submit" id="submit" value="Finish?">
        </fieldset>
    </form>
</body>
</html>
